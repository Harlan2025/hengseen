app = "hengseen-backend"

[build]
  builder = "paketobuildpacks/builder:full"

[deploy]
  health_check_path = "/health"
  health_check_timeout_seconds = 30
  restart_policy_type = "on_failure"
  restart_policy_max_retries = 10

[env]
  PORT = "8000"
  PYTHON_VERSION = "3.11"

[mounts]
  source = "data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
