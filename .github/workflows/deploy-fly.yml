name: Deploy to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Fly.io
        uses: fly-apps/actions-deploy-fly@v1
        with:
          command: fly deploy
          args: --app hengseen-backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
