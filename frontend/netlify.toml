[build]
command = "npm run build"
publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://api.hengseen.com/api/:splat"
  status = 200

[[headers]]
  for = "/assets/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"
